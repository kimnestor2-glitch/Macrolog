<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>MacroLog</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:480px;margin:auto;padding:26px 18px}h1{font-size:27px;margin:0 0 20px}.card{background:#192238;border:1px solid #303c56;border-radius:20px;padding:22px;margin-bottom:18px}.muted{color:#9eabc0;font-size:14px}.cal{font-size:42px;font-weight:750;margin:8px 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{font-size:21px;font-weight:700}.stat small{display:block;font-size:12px;font-weight:400;color:#aab6cb;margin-top:4px}label{display:block;font-size:14px;color:#cbd5e1;margin-bottom:6px}input{width:100%;background:#0d1528;color:white;border:1px solid #485775;border-radius:12px;padding:14px 8px;font-size:18px;min-width:0}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}button{border:0;background:#77d7ba;color:#092319;border-radius:12px;padding:15px;font-weight:750;font-size:16px;cursor:pointer}.add{width:100%;margin-top:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}input[type=date]{width:auto;max-width:180px;font-size:14px;padding:10px}.entry{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #344057;padding:14px 0;gap:10px}.entry button{background:#344057;color:#fff;padding:8px 10px;font-size:13px}.empty{color:#aab6cb;font-size:14px}.hint{font-size:12px;color:#95a3b9;margin-top:20px}</style></head><body><main class="wrap"><h1>MacroLog</h1><section class="card"><div class="head"><span class="muted">Registrerat</span><input id="date" type="date" aria-label="Välj datum"></div><div class="cal"><span id="cal">0</span> <span style="font-size:17px;color:#9eabc0">kcal</span></div><div class="stats"><div class="stat"><span id="tp">0</span> g<small>Protein</small></div><div class="stat"><span id="tf">0</span> g<small>Fett</small></div><div class="stat"><span id="tc">0</span> g<small>Kolhydrater</small></div></div></section><section class="card"><h2 style="font-size:18px;margin:0 0 16px">Lägg till makron</h2><form id="form"><div class="fields"><div><label for="p">Protein (g)</label><input id="p" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div><div><label for="f">Fett (g)</label><input id="f" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div><div><label for="c">Kolhydrater (g)</label><input id="c" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div></div><button class="add" type="submit">+ Lägg till</button></form></section><section class="card"><h2 style="font-size:18px;margin:0 0 12px">Registreringar</h2><div id="entries" aria-live="polite"></div></section><p class="hint">Uppgifterna sparas i den här webbläsaren på den här enheten. Rensa inte webbplatsdata om du vill behålla historiken.</p></main><script>const $=id=>document.getElementById(id),key='macrolog-v1';let data={};try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){}const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};$('date').value=today();const save=()=>localStorage.setItem(key,JSON.stringify(data));const fmt=n=>Number(n.toFixed(1)).toLocaleString('sv-SE');function render(){const items=data[$('date').value]||[];let p=0,f=0,c=0;items.forEach(e=>{p+=e.p;f+=e.f;c+=e.c});$('tp').textContent=fmt(p);$('tf').textContent=fmt(f);$('tc').textContent=fmt(c);$('cal').textContent=fmt(p*4+f*9+c*4);const list=$('entries');list.replaceChildren();if(!items.length){let x=document.createElement('p');x.className='empty';x.textContent='Inga registreringar för den här dagen.';list.append(x)}items.forEach((e,i)=>{let row=document.createElement('div');row.className='entry';let info=document.createElement('div');let a=document.createElement('div');a.textContent=`P ${fmt(e.p)} g · F ${fmt(e.f)} g · K ${fmt(e.c)} g`;let b=document.createElement('div');b.className='muted';b.textContent=`${fmt(e.p*4+e.f*9+e.c*4)} kcal`;info.append(a,b);let del=document.createElement('button');del.textContent='Ta bort';del.setAttribute('aria-label','Ta bort registrering');del.onclick=()=>{data[$('date').value].splice(i,1);save();render()};row.append(info,del);list.append(row)})}$('date').onchange=render;$('form').onsubmit=e=>{e.preventDefault();let vals=['p','f','c'].map(id=>$(id).value.trim()===''?0:Number($(id).value));if(vals.some(v=>!Number.isFinite(v)||v<0)||vals.every(v=>v===0)){alert('Ange minst ett värde större än 0.');return}let day=$('date').value;(data[day]??=[]).push({p:vals[0],f:vals[1],c:vals[2]});try{save()}catch(e){alert('Kunde inte spara. Kontrollera webbläsarens lagringsinställningar.');return}$('form').reset();render()};render();if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js").catch(()=>{})}</script></body></html>
